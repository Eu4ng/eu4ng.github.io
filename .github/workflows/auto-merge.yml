# develop 브랜치 자동 병합
name: Auto merge for develop branch

on:
  # Actions 탭에서 수동으로 실행 가능
  workflow_dispatch:

  # 한국 시간 기준 매일 자정에 자동으로 실행
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: write
  pull-requests: write

# 스케줄과 수동 실행이 겹쳐 PR 생성이 경합하지 않도록 함
concurrency:
  group: auto-merge-develop
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 모든 브랜치 히스토리를 가져와서 비교할 수 있도록 함
          fetch-depth: 0

      # 자동 병합 진행 여부 확인
      - name: Check for commits to merge
        id: check_changes
        run: |
          set -euo pipefail
          COMMITS=$(git rev-list --count origin/main..origin/develop)
          echo "commits=$COMMITS" >> $GITHUB_OUTPUT
          echo "develop 브랜치에 main으로 병합할 커밋이 $COMMITS 개 있습니다."

      # PR 생성 및 자동 병합 진행
      - name: Create pull request and enable auto-merge
        if: steps.check_changes.outputs.commits != '0'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail

          # 기존에 develop -> main 으로 열려있는 PR이 있는지 확인
          EXISTING_PR=$(gh pr list --base main --head develop --state open --json url --jq '.[0].url')

          if [ -z "$EXISTING_PR" ]; then
            echo "새로운 PR을 생성합니다."
            PR_URL=$(gh pr create \
              --base main \
              --head develop \
              --title "merge: develop -> main 동기화" \
              --body "매일 자정에 \`develop\` 브랜치에서 \`main\` 브랜치로 병합하기 위해 자동으로 생성된 PR입니다.
          설정된 CI 테스트 통과 시 자동으로 병합됩니다.")
            echo "생성된 PR: $PR_URL"
          else
            echo "이미 열려있는 PR이 존재합니다: $EXISTING_PR"
            PR_URL="$EXISTING_PR"
          fi

          # 해당 PR에 대해 자동 병합 활성화
          if [ -n "$PR_URL" ]; then
            PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq .number)

            echo "PR 자동 병합 활성화 (#$PR_NUMBER)"

            gh pr merge "$PR_URL" --auto --merge \
              --subject "merge: develop -> main 동기화 (#$PR_NUMBER)" \
              --body ""
          else
            echo "PR 생성 및 확인에 실패했습니다."
            exit 1
          fi
