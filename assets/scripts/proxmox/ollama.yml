# 모델 서버(Ollama) LXC. group_vars 의 ollama_backends 마다 CT 하나를 만들고 Ollama 를 설치해 모델을 받아 둡니다.
# gpu: true 인 CT 는 그 Proxmox 호스트의 iGPU(/dev/dri/renderD128)를 넘겨 Vulkan 으로 추론합니다(AMD iGPU 는 ROCm 지원 밖).
# 클러스터에서는 k8s-gitops services/ollama 의 HAProxy 가 이 CT 들을 <이름>.<도메인> 으로 불러 요청을 나눕니다(어느 서버를 먼저 쓸지는 그쪽이 실측 속도로 정합니다).
# 모델 저장소는 모든 CT 가 하나를 함께 씁니다. ollama_nfs_host 노드의 thin LV 를 ollama_models_dir 에 붙여 그 안의 store 를 NFS 로 내보내고,
# 다른 노드는 그 store 를 같은 경로에 마운트하며, CT 마다 store 를 바인드 마운트합니다. 모델은 한 번만 받고, 공유 폴더에서 다른 CT 의
# 받는 중인 파일을 지우지 않게 OLLAMA_NOPRUNE=1 로 돕니다(group_vars 의 설명 참고).
#   ansible-playbook playbooks/ollama.yml                          (PROXMOX_* 환경변수 필요, README 참고)
#   ansible-playbook playbooks/ollama.yml -e ollama_pull_models=false   (모델을 받지 않음. 다른 곳의 모델 파일을 옮겨 넣을 때)
---
- name: Ollama CT 정의
  hosts: localhost
  gather_facts: false
  tasks:
    - name: CT 정의 (있으면 설정만 맞춤)
      community.proxmox.proxmox:
        node: "{{ item.pve }}"
        vmid: "{{ item.vmid }}"
        hostname: "{{ item.name }}"
        ostemplate: "{{ ct_template_storage }}:vztmpl/{{ lan_dns_template }}"
        cores: "{{ item.cores }}"
        memory: "{{ item.memory }}"
        swap: 0
        disk: "{{ ct_disk_storage }}:{{ item.disk }}"
        netif: { net0: "name=eth0,bridge={{ ct_bridge }},ip={{ item.ip }}/24,gw={{ ct_gateway }}" }
        nameserver: "{{ (lan_dns_instances | map(attribute='ip') | list) | join(' ') }}"
        searchdomain: "{{ lan_dns_domain }}"
        features: [nesting=1]
        onboot: true
        unprivileged: true
        pubkey: "{{ ct_ssh_pubkeys | join('\n') }}"
        state: present
      loop: "{{ ollama_backends }}"
      loop_control: { label: "{{ item.name }}" }

- name: iGPU 넘기기
  hosts: proxmox
  gather_facts: false
  tasks:
    # 장치는 CT 가 시작할 때 붙으므로, 새로 넣었으면 돌고 있는 CT 를 다시 시작합니다.
    # CT 안 장치의 그룹은 호스트 render 그룹 번호로 맞춥니다(호스트를 다시 설치하면 바뀔 수 있어 고정하지 않음)
    - name: /dev/dri/renderD128 (gpu CT 만)
      ansible.builtin.shell: |
        gid=$(stat -c %g /dev/dri/renderD128)
        pct config {{ item.vmid }} | grep -qx "dev0: /dev/dri/renderD128,gid=$gid" && exit 0
        pct set {{ item.vmid }} --dev0 /dev/dri/renderD128,gid=$gid
        pct status {{ item.vmid }} | grep -q running && pct reboot {{ item.vmid }}
        echo CHANGED
      register: dri
      changed_when: "'CHANGED' in dri.stdout"
      loop: "{{ ollama_backends | selectattr('pve', 'eq', inventory_hostname) | selectattr('gpu') }}"
      loop_control: { label: "{{ item.name }}" }
    # iGPU 가 쓸 호스트 RAM 상한(group_vars 의 ollama_gtt_gib). amdgpu 의 GTT 는 ttm 모듈의 pages_limit(4 KiB 페이지 수)이 정하고,
    # amdgpu 가 initramfs 에서 올라오므로 initramfs 도 다시 만든다. 재부팅해야 적용된다 — 적용 여부는 /sys/module/ttm/parameters/pages_limit
    # GRUB 의 amdgpu.gttsize 는 쓰지 않는다(ttm 한도와 둘로 나뉘어 헷갈림). 예전에 넣은 값은 지우지 않는다.
    - name: ttm pages_limit (gpu CT 가 있는 호스트만)
      ansible.builtin.copy:
        dest: /etc/modprobe.d/ttm.conf
        content: |
          # proxmox-ansible playbooks/ollama.yml: iGPU GTT 상한 {{ ollama_gtt_gib }} GiB
          options ttm pages_limit={{ (ollama_gtt_gib * 262144) | int }}
        mode: "0644"
      register: ttm_conf
      when: ollama_backends | selectattr('pve', 'eq', inventory_hostname) | selectattr('gpu') | list | length > 0
    - name: update-initramfs
      ansible.builtin.command: update-initramfs -u
      when: ttm_conf is changed
      changed_when: true
    - name: GTT 상한 적용 여부 (다르면 재부팅 필요)
      ansible.builtin.shell: |
        want={{ (ollama_gtt_gib * 262144) | int }}
        have=$(cat /sys/module/ttm/parameters/pages_limit 2>/dev/null || echo none)
        [ "$have" = "$want" ] && echo "적용됨 ($want 페이지)" || echo "재부팅 필요: 지금 $have, 설정 $want 페이지"
      register: ttm_now
      changed_when: false
      when: ttm_conf is not skipped
    - name: GTT 상한 상태
      ansible.builtin.debug: { msg: "{{ ttm_now.stdout }}" }
      when: ttm_conf is not skipped

- name: 모델 저장소 (ollama_nfs_host 의 thin LV 원본 + NFS 로 다른 노드와 단일 공유)
  hosts: proxmox
  gather_facts: false
  vars:
    backends_here: "{{ ollama_backends | selectattr('pve', 'eq', inventory_hostname) | list }}"
    is_nfs_host: "{{ inventory_hostname == ollama_nfs_host }}"
    nfs_clients: "{{ ollama_backends | map(attribute='pve') | unique | reject('eq', ollama_nfs_host) | list }}"
  tasks:
    # --- NFS 호스트를 옮겼을 때: 새 호스트의 옛 NFS 마운트를 내리고, 옛 호스트의 export 를 뺍니다 ---
    # 새 호스트는 store 에 옛 호스트의 NFS 가 붙어 있어 그대로 로컬 LV 를 상위 경로에 붙이면 가려진 채 남습니다.
    # CT 가 바인드로 쓰고 있으면 umount 가 실패하니 CT 를 끄고 실행합니다. 옛 호스트의 LV 는 지우지 않습니다(옮긴 것을 확인한 뒤 손으로).
    - name: 옛 NFS 마운트 해제 (NFS 호스트가 된 노드)
      ansible.builtin.shell: |
        grep -qE '^[^#[:space:]]+:{{ ollama_models_dir }}/store[[:space:]]+{{ ollama_models_dir }}/store[[:space:]]+nfs' /etc/fstab || exit 0
        if findmnt -t nfs,nfs4 {{ ollama_models_dir }}/store >/dev/null; then umount {{ ollama_models_dir }}/store || exit 1; fi
        sed -i -E '\|^[^#[:space:]]+:{{ ollama_models_dir }}/store[[:space:]]+{{ ollama_models_dir }}/store[[:space:]]+nfs|d' /etc/fstab
        systemctl daemon-reload
        echo CHANGED
      register: r
      changed_when: "'CHANGED' in r.stdout"
      when: is_nfs_host
    - name: 옛 NFS export 제거 (NFS 호스트가 아니거나 내보낼 노드가 없을 때)
      ansible.builtin.shell: |
        [ -f /etc/exports.d/ollama.exports ] || exit 0
        rm -f /etc/exports.d/ollama.exports
        exportfs -ra
        echo CHANGED
      register: r
      changed_when: "'CHANGED' in r.stdout"
      when: not is_nfs_host or nfs_clients | length == 0

    # --- NFS 호스트: 로컬 thin LV + ext4 마운트 + NFS export ---
    - name: thin LV (pve/ollama-models)
      community.general.lvol:
        vg: pve
        lv: ollama-models
        thinpool: data
        size: "{{ ollama_models_lv_size }}"
        shrink: false          # 손으로 늘린 뒤 다시 실행해도 줄이지 않습니다
      when: is_nfs_host
    - name: ext4 (처음 한 번)
      community.general.filesystem:
        fstype: ext4
        dev: /dev/pve/ollama-models
      when: is_nfs_host and not ansible_check_mode   # check 모드에서는 LV 가 아직 없다
    # nofail 을 쓰지 않습니다. 마운트가 안 되면 아래 store 폴더가 없어 CT 가 시작하지 못하고(라우터가 건너뜀),
    # 호스트 루트에 모델을 받는 일이 없습니다
    - name: 마운트 (fstab)
      ansible.posix.mount:
        path: "{{ ollama_models_dir }}"
        src: /dev/pve/ollama-models
        fstype: ext4
        opts: defaults
        state: mounted
      register: models_mount
      when: is_nfs_host
    - name: systemd 가 바뀐 fstab 을 읽게
      ansible.builtin.systemd:
        daemon_reload: true
      when: is_nfs_host and (models_mount is changed)
    - name: store 폴더 (CT 의 root 가 쓰도록 비특권 CT 의 uid 100000 소유)
      ansible.builtin.file:
        path: "{{ ollama_models_dir }}/store"
        state: directory
        owner: "100000"
        group: "100000"
        mode: "0755"
      when: is_nfs_host
    - name: nfs-kernel-server 패키지 설치
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present
      when: is_nfs_host and nfs_clients | length > 0
    - name: NFS export 설정 (/etc/exports.d/ollama.exports)
      ansible.builtin.copy:
        dest: /etc/exports.d/ollama.exports
        content: |
          {% for h in nfs_clients %}
          {{ ollama_models_dir }}/store {{ hostvars[h].ansible_host }}(rw,sync,no_subtree_check,all_squash,anonuid=100000,anongid=100000)
          {% endfor %}
        mode: "0644"
      register: nfs_export
      when: is_nfs_host and nfs_clients | length > 0
    - name: NFS export 갱신 및 서비스 재시작
      ansible.builtin.shell: |
        exportfs -ra
        systemctl restart nfs-server
      when: is_nfs_host and nfs_clients | length > 0 and (nfs_export is changed)

    # --- NFS 클라이언트 호스트: NFS 마운트 ---
    - name: NFS 클라이언트 마운트 폴더 준비
      ansible.builtin.file:
        path: "{{ ollama_models_dir }}/store"
        state: directory
      when: not is_nfs_host and (backends_here | length > 0)
    - name: NFS 마운트 (fstab)
      ansible.posix.mount:
        path: "{{ ollama_models_dir }}/store"
        src: "{{ ollama_nfs_server_ip }}:{{ ollama_models_dir }}/store"
        fstype: nfs
        opts: "nfsvers=4.2,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,_netdev"
        state: mounted
      when: not is_nfs_host and (backends_here | length > 0)

    # --- 공통: CT 에 바인드 마운트 ---
    # 새 경로에 붙이므로(옛 /var/lib/ollama/models 를 가리지 않음) 실행 중인 CT 에도 재부팅 없이 바로 붙습니다
    - name: CT 에 바인드 마운트
      ansible.builtin.shell: |
        pct config {{ item.vmid }} | grep -q '^mp0: {{ ollama_models_dir }}/store,' && exit 0
        pct set {{ item.vmid }} --mp0 {{ ollama_models_dir }}/store,mp={{ ollama_models_dir }}
        echo CHANGED
      register: bind
      changed_when: "'CHANGED' in bind.stdout"
      loop: "{{ backends_here }}"
      loop_control: { label: "{{ item.name }}" }

- name: Ollama CT 시작
  hosts: localhost
  gather_facts: false
  tasks:
    - name: CT 시작
      community.proxmox.proxmox:
        node: "{{ item.pve }}"
        vmid: "{{ item.vmid }}"
        hostname: "{{ item.name }}"
        state: started
      loop: "{{ ollama_backends }}"
      loop_control: { label: "{{ item.name }}" }
    - name: SSH 열릴 때까지 대기
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 22
        timeout: 120
      loop: "{{ ollama_backends }}"
      loop_control: { label: "{{ item.name }}" }

- name: Ollama 설치와 모델
  hosts: ollama
  gather_facts: false
  vars:
    backend: "{{ ollama_backends | selectattr('name', 'eq', inventory_hostname) | first }}"
    ollama_pull_models: true
  pre_tasks:
    - name: python3 준비 (Ansible 모듈 실행에 필요)
      ansible.builtin.raw: command -v python3 >/dev/null || (apt-get update -q && apt-get install -y -q python3)
      changed_when: false
  tasks:
    - name: 시간대
      community.general.timezone:
        name: "{{ timezone }}"
    - name: 패키지 (gpu CT 는 Vulkan 드라이버 RADV 포함)
      ansible.builtin.apt:
        name: "{{ ['curl', 'ca-certificates', 'zstd'] + (['mesa-vulkan-drivers'] if backend.gpu else []) }}"
        update_cache: true
        cache_valid_time: 3600
    - name: Ollama 설치 (버전이 다를 때만)
      ansible.builtin.shell: |
        [ -x /usr/local/bin/ollama ] && /usr/local/bin/ollama -v 2>/dev/null | grep -q "{{ ollama_version }}" && exit 0
        curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION={{ ollama_version }} sh >/tmp/ollama-install.log 2>&1
        echo CHANGED
      register: install
      changed_when: "'CHANGED' in install.stdout"
    # 설치 스크립트의 서비스 계정(ollama) 대신 root 로 돕니다. 비특권 CT 라 호스트에서는 일반 계정이고, 넘긴 GPU 장치를 그룹 설정 없이 씁니다
    - name: 서비스 설정 폴더
      ansible.builtin.file:
        path: /etc/systemd/system/ollama.service.d
        state: directory
        mode: "0755"
    - name: 서비스 설정
      ansible.builtin.copy:
        dest: /etc/systemd/system/ollama.service.d/override.conf
        mode: "0644"
        content: |
          [Service]
          User=root
          Group=root
          Environment=OLLAMA_HOST=0.0.0.0:11434
          Environment=OLLAMA_MODELS={{ ollama_models_dir }}
          Environment=OLLAMA_NOPRUNE=1
          Environment=OLLAMA_KEEP_ALIVE=30m
          Environment=OLLAMA_MAX_LOADED_MODELS=1
          Environment=OLLAMA_NUM_PARALLEL=1
          {% if backend.gpu %}
          Environment=OLLAMA_VULKAN=1
          Environment=OLLAMA_IGPU_ENABLE=1
          # flash attention 은 기본으로 켜고, 문제가 있는 GPU 만 group_vars 의 flash_attention: false 로 끈다. Radeon 780M 에서는 켜는 쪽이
          # 빠르다(2026-10-09 실측, group_vars 참고). Vulkan(RADV, Radeon 610M)에서는 켜면 gemma4:e4b 가 약 750토큰을 넘는 프롬프트마다
          # llama-server 가 'free(): invalid pointer' 로 죽었다(2026-09-29, ollama 0.34.4) — 새 GPU 는 긴 프롬프트로 먼저 확인한다.
          Environment=OLLAMA_FLASH_ATTENTION={{ 1 if backend.flash_attention | default(true) else 0 }}
          {% endif %}
      register: override
    - name: 모델 폴더 (호스트 저장소의 바인드 마운트)
      ansible.builtin.file:
        path: "{{ ollama_models_dir }}"
        state: directory
        mode: "0755"
    - name: 서비스 다시 읽기·시작
      ansible.builtin.systemd:
        name: ollama
        daemon_reload: true
        enabled: true
        state: "{{ 'restarted' if (override.changed or install.changed) else 'started' }}"
    - name: API 응답 대기
      ansible.builtin.uri:
        url: http://127.0.0.1:11434/api/version
      register: api
      until: api.status == 200
      retries: 30
      delay: 2
    # 라우터(k8s-gitops haproxy.cfg 의 agent-check)에 상태를 알리는 에이전트. GPU 가 멈춰 llama-server 가 커널 안(D 상태)에 걸리면
    # ollama 는 살아 있어 헬스체크를 통과하는데 이 에이전트가 drain 으로 답해 새 요청을 막는다
    - name: 상태 보고 에이전트 스크립트
      ansible.builtin.copy:
        src: ../templates/ollama/ollama-agent.py
        dest: /usr/local/bin/ollama-agent.py
        mode: "0755"
      register: agent_script
    - name: 상태 보고 에이전트 서비스
      ansible.builtin.copy:
        dest: /etc/systemd/system/ollama-agent.service
        mode: "0644"
        content: |
          [Unit]
          Description=Ollama 상태 보고(HAProxy agent-check 포트 {{ ollama_agent_port }}, 상태 JSON 포트 {{ ollama_agent_status_port }})
          After=network-online.target
          [Service]
          Environment=AGENT_PORT={{ ollama_agent_port }}
          Environment=AGENT_STATUS_PORT={{ ollama_agent_status_port }}
          ExecStart=/usr/bin/python3 /usr/local/bin/ollama-agent.py
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
      register: agent_unit
    - name: 상태 보고 에이전트 시작
      ansible.builtin.systemd:
        name: ollama-agent
        daemon_reload: true
        enabled: true
        state: "{{ 'restarted' if (agent_script.changed or agent_unit.changed) else 'started' }}"
    - name: 모델 받기 (없는 것만)
      ansible.builtin.shell: |
        ollama list | awk 'NR>1{print $1}' | grep -qxF -e "{{ item }}" -e "{{ item }}:latest" && exit 0   # 태그 없이 적은 모델은 :latest 로 나온다
        ollama pull {{ item }} >/dev/null && echo CHANGED
      register: pull
      changed_when: "'CHANGED' in pull.stdout"
      loop: "{{ ollama_models }}"
      when: ollama_pull_models | bool
      throttle: 1              # 저장소를 함께 쓰는 CT 가 동시에 받지 않게 차례로. 뒤의 CT 는 이미 있어 건너뜁니다
    - name: 확인 (GPU CT 는 Vulkan 장치를 찾았는지)
      ansible.builtin.shell: |
        ollama list | awk 'NR>1{print $1}' | tr '\n' ' '
        {% if backend.gpu %}journalctl -u ollama -b --no-pager | grep -q 'library=Vulkan' && echo "GPU: Vulkan"{% endif %}
      register: check
      changed_when: false
    - name: 결과
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ check.stdout_lines | join(' / ') }}"
