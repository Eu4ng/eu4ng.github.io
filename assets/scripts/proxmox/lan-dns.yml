# 내부망 DNS 컨테이너. 밖에 여는 서비스 이름만 클러스터 노드 IP 로 답해, 집 안에서는 Cloudflare 를 거치지 않고 노드로 직접 붙게 합니다.
# 세 CT 가 keepalived 로 VIP(lan_dns_vip)를 나눠 가져 공유기 DHCP 에는 VIP 와 CT 주소 하나만 줍니다.
#   ansible-playbook playbooks/lan-dns.yml   (PROXMOX_* 환경변수 필요, README 참고)
---
- import_playbook: main-node.yml

- name: CT 템플릿 준비
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: 템플릿 내려받기 (없을 때만)
      ansible.builtin.command: pveam download {{ ct_template_storage }} {{ lan_dns_template }}
      args:
        creates: /var/lib/vz/template/cache/{{ lan_dns_template }}

- name: lan-dns CT 만들기
  hosts: localhost
  gather_facts: false
  tasks:
    - name: CT 정의 (있으면 설정만 맞춤)
      community.proxmox.proxmox:
        node: "{{ item.pve }}"
        vmid: "{{ item.vmid }}"
        hostname: "{{ item.name }}"
        ostemplate: "{{ ct_template_storage }}:vztmpl/{{ lan_dns_template }}"
        cores: 1
        memory: 256
        swap: 0
        disk: "{{ ct_disk_storage }}:2"
        netif: { net0: "name=eth0,bridge={{ ct_bridge }},ip={{ item.ip }}/24,gw={{ ct_gateway }}" }
        nameserver: "{{ lan_dns_upstream[0] }}"
        features: [nesting=1]         # Debian 13(systemd 257)은 nesting 없이는 tmp·run-lock 마운트가 실패합니다. 바꾸면 CT 를 다시 시작해야 적용
        onboot: true
        unprivileged: true
        pubkey: "{{ ct_ssh_pubkeys | join('\n') }}"
        state: present
      loop: "{{ lan_dns_instances }}"
      loop_control: { label: "{{ item.name }}" }
    - name: CT 시작
      community.proxmox.proxmox:
        node: "{{ item.pve }}"
        vmid: "{{ item.vmid }}"
        hostname: "{{ item.name }}"
        state: started
      loop: "{{ lan_dns_instances }}"
      loop_control: { label: "{{ item.name }}" }
    - name: SSH 열릴 때까지 대기
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 22
        timeout: 120
      loop: "{{ lan_dns_instances }}"
      loop_control: { label: "{{ item.name }}" }

- name: CT 안에 dnsmasq 설정
  hosts: lan_dns
  gather_facts: false
  serial: 1                       # 한 CT 씩(dnsmasq 재시작이 세 CT 에서 겹치지 않게)
  pre_tasks:
    - name: python3 준비 (Ansible 모듈 실행에 필요)
      ansible.builtin.raw: command -v python3 >/dev/null || (apt-get update -q && apt-get install -y -q python3)
      changed_when: false
  tasks:
    - name: 시간대
      community.general.timezone:
        name: "{{ timezone }}"
    - name: dnsmasq 설치
      ansible.builtin.apt:
        name: dnsmasq
        update_cache: true
        cache_valid_time: 3600
    - name: 설정 파일
      ansible.builtin.template:
        src: ../templates/dnsmasq-lan.conf.j2
        dest: /etc/dnsmasq.d/lan.conf
        mode: "0644"
        validate: dnsmasq --test --conf-file=%s
      notify: dnsmasq 재시작
    - name: 유닛 덮어쓰기 폴더
      ansible.builtin.file:
        path: /etc/systemd/system/dnsmasq.service.d
        state: directory
        mode: "0755"
    - name: 유닛 덮어쓰기 (네트워크가 준비된 뒤 시작하고, 죽으면 다시 시작)
      ansible.builtin.copy:
        dest: /etc/systemd/system/dnsmasq.service.d/restart.conf
        mode: "0644"
        content: |
          # proxmox-ansible 의 playbooks/lan-dns.yml 이 만듭니다. 직접 고치지 마세요.
          # 호스트 재부팅 직후 주소가 붙기 전에 시작해 "Cannot assign requested address" 로 죽고 다시 뜨지 않던 것을 막습니다.
          [Unit]
          After=network-online.target
          Wants=network-online.target

          [Service]
          Restart=on-failure
          RestartSec=5
      notify: dnsmasq 재시작
    - name: dnsmasq 켜기
      ansible.builtin.systemd:
        name: dnsmasq
        enabled: true
        state: started
        daemon_reload: true
    # 공유기 DHCP 는 DNS 를 두 개만 받으므로 세 CT 가 VIP(lan_dns_vip)를 keepalived 로 나눠 갖습니다(k8s-cluster.yml 의 API VIP 와 같은 방식).
    # unprivileged CT 도 자기 네트워크 이름공간에서는 주소를 붙이고 VRRP 를 보낼 수 있습니다
    - name: keepalived·dig 설치
      ansible.builtin.apt:
        name: [keepalived, dnsutils]
    - name: dnsmasq 검사 스크립트
      ansible.builtin.copy:
        dest: /etc/keepalived/check-dnsmasq.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # keepalived track_script. 이 CT 의 dnsmasq 가 직접 가진 이름({{ check_name }})을 NOERROR 와 기대한 A 값({{ check_ip }})으로 답하면 성공입니다.
          # 답하지 못하면 다른 DNS CT 중 하나라도 답할 때만 실패해 FAULT 로 VIP 를 놓습니다. 모두 답하지 못하면 성공으로 두어 누군가는 VIP 를 가집니다.
          # 외부 이름은 캐시로 답할 수 있어 묻지 않습니다. 한 번에 1초까지, 다른 CT 들은 함께 물어 keepalived timeout(4초) 안에 끝납니다
          ok() {
            dig +time=1 +tries=1 +noall +comments +answer @"$1" {{ check_name }} A 2>/dev/null |
              awk -v want={{ check_ip }} '/status: NOERROR/ {s=1} $4 == "A" && $5 == want {a=1} END {exit !(s && a)}'
          }
          ok {{ ansible_host }} && exit 0
          pids=()
          for ip in {{ lan_dns_instances | rejectattr('name', 'equalto', inventory_hostname) | map(attribute='ip') | join(' ') }}; do ok "$ip" & pids+=($!); done
          for p in "${pids[@]}"; do wait "$p" && exit 1; done
          exit 0
      vars:
        check_name: "{{ lan_dns_names[0] }}.{{ lan_dns_domain }}"
        check_ip: "{{ lan_dns_targets[0] }}"
    - name: keepalived 설정
      ansible.builtin.template:
        src: ../templates/keepalived/lan-dns.conf.j2
        dest: /etc/keepalived/keepalived.conf
        mode: "0644"
      register: keepalived_conf
    - name: keepalived 켜기
      ansible.builtin.systemd:
        name: keepalived
        enabled: true
        state: "{{ 'restarted' if keepalived_conf.changed else 'started' }}"
      ignore_errors: "{{ ansible_check_mode }}"   # --check 에서는 패키지가 아직 없을 수 있음
  handlers:
    - name: dnsmasq 재시작
      ansible.builtin.systemd:
        name: dnsmasq
        state: restarted
        daemon_reload: true

- name: 호스트 정리와 확인 (기준 노드에서)
  hosts: pve_main
  gather_facts: false
  vars:
    first_name: "{{ lan_dns_names[0] }}.{{ lan_dns_domain }}"
  tasks:
    - name: 호스트에 직접 깔았던 옛 dnsmasq 제거
      ansible.builtin.apt:
        name: dnsmasq
        state: absent
        purge: true
    - name: 옛 설정 파일 제거
      ansible.builtin.file:
        path: /etc/dnsmasq.d/lan.conf
        state: absent
    - name: dig 준비
      ansible.builtin.apt:
        name: dnsutils
    - name: 조회 검사 (DNS CT 마다)
      ansible.builtin.shell: |
        echo "A     {{ first_name }} -> $(dig +short +time=2 @{{ item.ip }} {{ first_name }} A | tr '\n' ' ')"
        echo "AAAA  {{ first_name }} -> $(dig +short +time=2 @{{ item.ip }} {{ first_name }} AAAA | tr '\n' ' ')(비어 있어야 함)"
        echo "공개  www.{{ lan_dns_domain }} -> $(dig +short +time=2 @{{ item.ip }} www.{{ lan_dns_domain }} A | tr '\n' ' ')"
        echo "외부  github.com -> $(dig +short +time=2 @{{ item.ip }} github.com A | tr '\n' ' ')"
      register: dns_check            # lookup 은 예약어라 쓰지 않음(인벤토리의 lookup() 을 가림)
      changed_when: false
      loop: "{{ lan_dns_instances }}"
      loop_control: { label: "{{ item.name }}" }
    - name: 결과
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: {{ item.stdout_lines }}"
      loop: "{{ dns_check.results }}"
      loop_control: { label: "{{ item.item.name }}" }
    - name: 노드 IP 로 답하는지
      ansible.builtin.assert:
        that: lan_dns_targets[0] in item.stdout_lines[0]
        fail_msg: "{{ item.item.name }}: {{ first_name }} 이 노드 IP 로 풀리지 않습니다"
      loop: "{{ dns_check.results }}"
      loop_control: { label: "{{ item.item.name }}" }
    - name: VIP 로 답하는지 (keepalived 가 VIP 를 붙이고 dnsmasq 가 그 주소에서 받을 때까지)
      ansible.builtin.command: dig +short +time=2 +tries=1 @{{ lan_dns_vip }} {{ first_name }} A
      register: vip_check
      until: lan_dns_targets[0] in vip_check.stdout_lines
      retries: 15
      delay: 2
      changed_when: false
      when: not ansible_check_mode

- name: 내부망 DNS 를 쓰는 CT (inventory 밖, 그 CT 가 지금 있는 노드에서 pct 로 설정)
  hosts: proxmox
  gather_facts: false
  tasks:
    # CT 의 resolv.conf 는 Proxmox 가 시작할 때 CT 설정으로 씁니다. 지금 도는 CT 에도 바로 적용되게 파일도 같은 내용으로 바꿉니다.
    # 두 DNS CT 가 모두 죽어도 바깥 이름은 풀리게 마지막에 upstream 하나를 둡니다
    - name: DNS 서버 지정
      ansible.builtin.shell: |
        [ -e /etc/pve/lxc/{{ item }}.conf ] || exit 0   # /etc/pve/lxc 는 이 노드의 CT 만 보입니다(옮겨 다니는 CT)
        want="{{ (lan_dns_instances | map(attribute='ip') | list + lan_dns_upstream[:1]) | join(' ') }}"
        [ "$(pct config {{ item }} | sed -n 's/^nameserver: //p')" = "$want" ] && exit 0
        pct set {{ item }} --nameserver "$want" --searchdomain {{ lan_dns_domain }}
        pct exec {{ item }} -- sh -c 'f=/etc/resolv.conf; { echo "search {{ lan_dns_domain }}"; for n in $0; do echo "nameserver $n"; done; } > $f.new && mv $f.new $f' "$want"
        echo CHANGED
      register: pct_dns
      changed_when: "'CHANGED' in pct_dns.stdout"
      loop: "{{ lan_dns_client_pct_vmids }}"
